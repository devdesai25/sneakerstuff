services:
  backend:
    build: ./backend
    container_name: backend
    ports: 
      - "8000:8000"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - ./.env
    volumes:
      - ./backend:/app
    command: sh -c "ln -sfn /app /app/backend; gunicorn main:app -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000" 
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: frontend
    ports:
      - "5173:5173"
    volumes: 
    - ./frontend:/app
    - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    stdin_open: true
    tty: true